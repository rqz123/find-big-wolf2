schedule:
  start: "09:00"
  end: "18:00"
  weekdays: [0, 1, 2, 3, 4]

camera:
  device_index: -1
  fps_high: 15
  poll_interval_sec: 0.5

detection:
  pixel_threshold: 25
  contour_min_area: 800
  brightness_change_threshold: 25
  evidence_fps: 2
  pre_event_buffer_sec: 3
  # After movement, keep looking for a person and stop early when one is found.
  person_tracking_duration_sec: 15
  # Delete only logs/alert_*.jpg and logs/person_*.jpg after this many days.
  evidence_retention_days: 7
  evidence_cleanup_interval_hours: 6
  person_model_path: models/person_detection_nanodet_2022nov.onnx
  # >= direct threshold passes; lower candidates also need a YuNet face.
  person_confidence_threshold: 0.30
  person_direct_confidence_threshold: 0.50
  face_model_path: models/face_detection_yunet_2023mar.onnx
  face_confidence_threshold: 0.60
  # Whole frame plus enlarged center/doorway regions (normalised x1,y1,x2,y2).
  person_detection_regions:
    - [0.0, 0.0, 1.0, 1.0]
    - [0.25, 0.10, 0.80, 1.0]
    - [0.45, 0.20, 0.85, 0.95]
  person_nms_threshold: 0.3
  backoff_intervals_sec: [300, 900, 1800, 3600]
  quiet_reset_sec: 1800

telegram:
  credentials_file: telegram_credentials.yaml
  timeout_sec: 20
  retries: 3
  command_poll_timeout_sec: 20
  clip_duration_sec: 5
  clip_fps: 2
  clip_max_width: 640

logging:
  level: DEBUG
