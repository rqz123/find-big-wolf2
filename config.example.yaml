schedule:
  start: "09:00"
  end: "18:00"
  weekdays: [0, 1, 2, 3, 4]

camera:
  device_index: -1
  fps_high: 15
  poll_interval_sec: 30

detection:
  pixel_threshold: 25
  contour_min_area: 800
  brightness_change_threshold: 25
  backoff_intervals_sec: [300, 900, 1800, 3600]
  quiet_reset_sec: 1800

telegram:
  credentials_file: telegram_credentials.yaml
  timeout_sec: 20
  retries: 3

logging:
  level: DEBUG
